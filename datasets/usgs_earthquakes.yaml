# USGS earthquakes of the past 30 days, a rolling feed.
# Source: U.S. Geological Survey, public domain.
name: usgs_earthquakes
source:
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.csv
columns:
  - source: "time"
    name: time
    type: datetime
    format: "%Y-%m-%dT%H:%M:%S%.fZ"
    nullable: false
  - source: "latitude"
    name: latitude
    type: float
    min: -90
    max: 90
    nullable: false
  - source: "longitude"
    name: longitude
    type: float
    min: -180
    max: 180
    nullable: false
  # Kilometres; negative values are events above sea level.
  - source: "depth"
    name: depth
    type: float
    min: -10
    max: 1000
    nullable: false
  - source: "mag"
    name: mag
    type: float
    min: -10
    max: 10
    nullable: false
  - source: "magType"
    name: mag_type
    type: string
  - source: "nst"
    name: nst
    type: int
    min: 0
  - source: "gap"
    name: gap
    type: float
    min: 0
    max: 360
  - source: "dmin"
    name: dmin
    type: float
    min: 0
  - source: "rms"
    name: rms
    type: float
    min: 0
  # Format checks only: a rolling feed can add new networks or event
  # types at any time, so closed value sets would drop real events.
  - source: "net"
    name: net
    type: string
    pattern: '[a-z]{2}'
  # Network code followed by the network's own event code.
  - source: "id"
    name: id
    type: string
    nullable: false
    pattern: '[a-z]{2}[a-z0-9]+'
  - source: "updated"
    name: updated
    type: datetime
    format: "%Y-%m-%dT%H:%M:%S%.fZ"
  - source: "place"
    name: place
    type: string
  - source: "type"
    name: type
    type: string
  - source: "horizontalError"
    name: horizontal_error
    type: float
    min: 0
  - source: "depthError"
    name: depth_error
    type: float
    min: 0
  - source: "magError"
    name: mag_error
    type: float
    min: 0
  - source: "magNst"
    name: mag_nst
    type: int
    min: 0
  - source: "status"
    name: status
    type: string
  - source: "locationSource"
    name: location_source
    type: string
  - source: "magSource"
    name: mag_source
    type: string
rules:
  deduplicate_on: [id]
  drop_unmapped_columns: false
  # Rejected on 2026-11-20: 0% (0 of 9,737). A broken source rejects
  # most rows and is stopped before it replaces the table.
  max_rejected_ratio: 0.01
  # About 9,700 valid rows on 2026-11-20. The 30-day feed follows
  # seismic activity, so the floor is about 10% of that: low enough
  # for a quiet month, high enough to stop a truncated download.
  min_rows: 1000
target:
  table: usgs_earthquakes
  partition_by: time
  # The feed keeps 30 days: each run replaces those days and keeps the
  # older ones loaded by earlier runs.
  write_mode: partition
  cluster_by: [net, type]
