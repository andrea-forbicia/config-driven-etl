# Example dataset config documenting every option.
#
# The dataset is fictional: this file passes `validate` but cannot be run.
# Copy it to datasets/<name>.yaml to describe a new dataset.
#
# Names (name, target.table, column names and every reference to them) must
# be lowercase snake_case: a letter or underscore, then letters, digits or
# underscores, at most 128 characters. Unknown keys are rejected.

# Dataset identifier, also used for data/raw/<name>/ and
# data/processed/<name>/. Required.
name: city_weather

# Where the raw CSV comes from. Required.
source:
  # Set exactly one of url or path.
  # url: HTTP(S) address downloaded at extract time.
  # path: local file; a relative path starts from this file's directory.
  # Downloaded or copied, the CSV lands in data/raw/<name>/<name>.csv.
  url: https://example.org/city_weather.csv
  # path: ../local/city_weather.csv

  # Field separator, a single ASCII character. Default: ",".
  # Use "\t" for tab-separated files.
  delimiter: ","

  # File encoding. Default: utf-8.
  # utf-8: invalid bytes fail the run.
  # utf-8-lossy: invalid bytes are replaced with U+FFFD.
  encoding: utf-8

# One entry per CSV column to keep, in output order. At least one.
# Each column takes:
#   source:   CSV header, exactly as written in the file. Required, free
#             text, each header mapped at most once.
#   name:     target column name, unique. Required.
#   type:     string | int | float | bool | date | datetime. Required.
#   nullable: false rejects rows where the value is null: an empty
#             value on non-string columns, or a null_values sentinel.
#             Default: true.
#   format:   parse pattern, required on date and datetime columns and
#             not allowed on other types (e.g. "%Y-%m-%d"). Uses Polars
#             (chrono) directives and must include the year, month and
#             day. Offsets (%z) are converted to UTC. Use %.f or %6f
#             for fractions of a second; %f and %Z are rejected.
#   min, max: inclusive bounds on int and float columns, not allowed on
#             other types; rows outside the range are rejected. Optional,
#             finite numbers, min not above max.
#   null_values: sentinel strings read as null before the type is
#             checked (e.g. ["N/A", "-"]). A value matches when its
#             trimmed text equals an entry exactly, case included;
#             other values are left as written. Entries are unique and
#             have no surrounding whitespace; "" is allowed only on
#             string columns, where blank values are otherwise kept.
#             With nullable: false, a sentinel is rejected as null.
#             Quote every entry: unquoted NULL or -999 are not strings
#             in YAML and fail validation. Default: [].
#   allowed_values: closed set of accepted values on string, int and
#             date columns; rows with any other value are rejected as
#             not allowed. Values are compared after the cast, so "01"
#             matches "1" on an int column and dates are read with the
#             column format; strings are compared exactly as written.
#             Entries are quoted, valid for the type, unique after the
#             cast, within min / max, not in null_values, and not "".
#             A value that fails min / max or pattern gets only that
#             reason, not also "not allowed". Nulls are left to nullable.
#             Optional, at least one entry.
#   pattern:  regex that the whole value must match, on string columns
#             only; rows with any other value are rejected as no pattern
#             match. Values are matched as written, so "" is checked like
#             any other value (use null_values: [""] to read it as null).
#             Uses Polars (Rust) regex syntax: no look-around and no
#             backreferences; use (?i) to ignore case. Write it in single
#             quotes: double quotes treat backslashes as escapes, and
#             many regex characters are special in plain YAML. Nulls are
#             left to nullable; allowed_values entries must match it.
#             Optional, not empty.
# Rejected rows are counted and logged, never silently dropped: each one is
# written with its row number, reasons and raw values to
# data/processed/<name>/<name>.rejected.parquet.
columns:
  - source: "Date"
    name: observation_date
    type: date
    format: "%Y-%m-%d"
    nullable: false

  - source: "Observed At"
    name: observed_at
    type: datetime
    format: "%Y-%m-%d %H:%M:%S"

  - source: "Station"
    name: station_id
    type: string
    nullable: false
    allowed_values: ["ST01", "ST02", "ST03"]
    pattern: 'ST\d{2}'

  - source: "Temp (C)"
    name: temperature_c
    type: float
    min: -90
    max: 60
    null_values: ["N/A", "-"]

  - source: "Humidity (%)"
    name: humidity_pct
    type: int
    min: 0
    max: 100

  - source: "Raining"
    name: is_raining
    type: bool

# Dataset-wide cleaning rules. Optional.
rules:
  # Columns that identify a row; only the first of each set of duplicates
  # is kept, the others are rejected. Must name existing columns, without
  # repeats. Default: [] (no deduplication).
  deduplicate_on: [observation_date, station_id]

  # true: CSV columns not listed in `columns` are dropped.
  # false: any CSV column not listed in `columns` fails the run.
  # Default: true.
  drop_unmapped_columns: true

  # Highest share of rejected rows a run will accept: rejected rows divided
  # by the rows read, a number from 0.0 to 1.0 (0.05 is 5%, not 5),
  # unquoted and in decimal notation (YAML reads 5e-2 as a string). 0.0
  # will accept no rejected row. Validated only, not enforced yet.
  # Optional, no default.
  max_rejected_ratio: 0.05

# BigQuery destination. Required.
target:
  # Table name inside the BQ_DATASET dataset. Required.
  table: city_weather

  # Partition column: an existing date or datetime column. Optional.
  partition_by: observation_date

  # Clustering columns: up to 4 existing columns, without repeats, not of
  # type float (BigQuery cannot cluster on it). Default: [].
  cluster_by: [station_id]

  # truncate: every run replaces the existing data, so re-running the same
  # input leaves the same table state. Only allowed value. Default:
  # truncate.
  write_mode: truncate

  # Table for the rejected rows, in the same BQ_DATASET. Must differ from
  # table. After the valid rows, the load stage loads
  # data/processed/<name>/<name>.rejected.parquet into it, replacing its
  # data on every run (empty when no row is rejected). Columns:
  # row_number INT64 (the record's position: a quoted value spanning lines
  # counts once), reasons ARRAY<STRING>, raw STRUCT with every column
  # above as a STRING. Never partitioned or clustered: an existing table
  # with this name has its data replaced, but one that is partitioned or
  # clustered fails the run before any load. Removing this option leaves
  # the table in BigQuery. If its load fails, the run fails, with the
  # valid rows already loaded. Optional: without it, the rejected rows
  # stay in the Parquet file only.
  rejected_table: city_weather_rejected
