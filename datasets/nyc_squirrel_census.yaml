# 2018 Central Park Squirrel Census, one row per squirrel sighting.
# Source: NYC Open Data (vfnx-vebw), NYC Open Data Terms of Use.
name: nyc_squirrel_census
source:
  url: https://data.cityofnewyork.us/api/v3/views/vfnx-vebw/export.csv
columns:
  # Hectare, shift, date (MMDD + "18" for 2018) and sighting number.
  - source: "Unique Squirrel ID"
    name: squirrel_id
    type: string
    nullable: false
    pattern: '\d{1,2}[A-I]-(AM|PM)-\d{4}-\d{2}'
  - source: "Date"
    name: sighting_date
    type: date
    format: "%m%d%Y"
    nullable: false
  - source: "Shift"
    name: shift
    type: string
    allowed_values: ["AM", "PM"]
  - source: "X"
    name: longitude
    type: float
    min: -180
    max: 180
    nullable: false
  - source: "Y"
    name: latitude
    type: float
    min: -90
    max: 90
    nullable: false
  # Park grid: row 01-42, column A-I.
  - source: "Hectare"
    name: hectare
    type: string
    pattern: '\d{2}[A-I]'
  - source: "Hectare Squirrel Number"
    name: hectare_squirrel_number
    type: int
    min: 1
  # "?" when the sighter could not tell.
  - source: "Age"
    name: age
    type: string
    null_values: ["?"]
    allowed_values: ["Adult", "Juvenile"]
  - source: "Primary Fur Color"
    name: primary_fur_color
    type: string
    allowed_values: ["Gray", "Cinnamon", "Black"]
  - source: "Highlight Fur Color"
    name: highlight_fur_color
    type: string
  - source: "Location"
    name: location
    type: string
    allowed_values: ["Ground Plane", "Above Ground"]
  # Height in feet; "FALSE" when the squirrel is on the ground plane.
  - source: "Above Ground Sighter Measurement"
    name: above_ground_measurement
    type: int
    min: 0
    null_values: ["FALSE"]
  - source: "Running"
    name: running
    type: bool
  - source: "Chasing"
    name: chasing
    type: bool
  - source: "Climbing"
    name: climbing
    type: bool
  - source: "Eating"
    name: eating
    type: bool
  - source: "Foraging"
    name: foraging
    type: bool
  - source: "Kuks"
    name: kuks
    type: bool
  - source: "Quaas"
    name: quaas
    type: bool
  - source: "Moans"
    name: moans
    type: bool
  - source: "Tail flags"
    name: tail_flags
    type: bool
  - source: "Tail twitches"
    name: tail_twitches
    type: bool
  - source: "Approaches"
    name: approaches
    type: bool
  - source: "Indifferent"
    name: indifferent
    type: bool
  - source: "Runs from"
    name: runs_from
    type: bool
rules:
  deduplicate_on: [squirrel_id]
  drop_unmapped_columns: true
  # Rejected on 2026-11-20: 0.17% (5 of 3,023). A broken source rejects
  # most rows and is stopped before it replaces the table.
  max_rejected_ratio: 0.01
  # 3,018 valid rows on 2026-11-20. The 2018 census does not change,
  # so the floor sits just below that count.
  min_rows: 3000
target:
  table: nyc_squirrel_census