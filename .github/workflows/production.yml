name: Production runs

# Runs every dataset in datasets/, on demand from main, into the
# production environment: its own BigQuery dataset and service account,
# reached through Workload Identity Federation, so no key is stored.
# The environment holds GCP_SERVICE_ACCOUNT, BQ_DATASET and the variable
# BQ_AUDIT_TABLE; GCP_PROJECT_ID and GCP_WORKLOAD_IDENTITY_PROVIDER are
# the repository secrets the gcp tests use.
# There is no schedule: GitHub never fired one for this repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datasets:
    name: List datasets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      # example.yaml documents every option with a placeholder source.
      - name: List dataset files
        id: list
        run: |
          files=$(find datasets -maxdepth 1 -name '*.yaml' \
            ! -name example.yaml | sort | jq -Rsc 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.dataset }}
    needs: datasets
    if: needs.datasets.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      # One broken source must not stop the others from loading.
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.datasets.outputs.files) }}
    # Two runs of one dataset would race on the same tables; a second
    # dispatch waits for the first instead.
    concurrency:
      group: production-${{ matrix.dataset }}
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
      BQ_AUDIT_TABLE: ${{ vars.BQ_AUDIT_TABLE }}
      LOG_FORMAT: json
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      # The log goes to a file for the summary, then to the job log.
      - name: Run
        id: run
        run: |
          echo "name=$(basename "$DATASET" .yaml)" >> "$GITHUB_OUTPUT"
          status=0
          python -m config_driven_etl run "$DATASET" 2> run.log \
            || status=$?
          cat run.log >&2
          exit "$status"

      - name: Summary
        if: always()
        run: python3 .github/scripts/run_summary.py run.log "$DATASET"

      # Rejected rows are on the runner only; keep them for a look.
      - name: Keep rejected rows
        if: always() && steps.run.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: rejected-${{ steps.run.outputs.name }}
          path: data/processed/*/*.rejected.parquet
          if-no-files-found: ignore
          retention-days: 7
