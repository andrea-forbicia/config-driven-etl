name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Every commit on main must get its own result: a group keeps only one
  # pending run, so pushes are grouped per commit, not per branch.
  group: >-
    ci-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate dataset files
        run: python -m config_driven_etl validate datasets

      # The threshold applies to unit and system tests together, so the
      # partial runs only collect data and coverage report enforces it.
      - name: Unit tests
        run: >-
          pytest tests/unit
          --cov=config_driven_etl --cov-report= --cov-fail-under=0

      - name: System tests
        run: >-
          pytest tests/system
          --cov=config_driven_etl --cov-append --cov-report=
          --cov-fail-under=0

      - name: Coverage threshold
        run: coverage report

  # Real BigQuery sandbox, on main only. Authenticates through Workload
  # Identity Federation, so no key is stored; needs the repository secrets
  # GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID and
  # BQ_DATASET, and is skipped with a notice while any is missing.
  gcp:
    name: BigQuery sandbox tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] \
              && [ -n "$GCP_PROJECT_ID" ] && [ -n "$BQ_DATASET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GCP secrets not set, gcp tests skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v7

      - if: steps.secrets.outputs.available == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - if: steps.secrets.outputs.available == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.secrets.outputs.available == 'true'
        run: pip install -e ".[dev]"

      # The tests skip without credentials; fail here instead, so a broken
      # federation setup cannot pass as a green run.
      - name: Check credentials
        if: steps.secrets.outputs.available == 'true'
        run: python -c "import google.auth; google.auth.default()"

      - name: GCP tests
        if: steps.secrets.outputs.available == 'true'
        run: pytest -m gcp -rs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t config-driven-etl .

      - name: Smoke test image
        run: docker run --rm config-driven-etl validate datasets
