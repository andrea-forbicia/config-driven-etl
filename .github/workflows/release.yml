name: Release

# vX.Y.Z publishes a release with the CHANGELOG section [X.Y.Z].
# vX.Y.Z-<suffix> (for example v1.0.0-rc.1) publishes a pre-release with
# the [Unreleased] section. X.Y.Z must match the version in pyproject.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow may not ask for more than its caller grants, even
    # for a job it skips; ci.yml's gcp job runs on main only, not on tags.
    permissions:
      contents: read
      id-token: write

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        id: tag
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq .object.type)
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is not an annotated tag"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          version=$(python3 -c "import tomllib; print(tomllib.load(
            open('pyproject.toml', 'rb'))['project']['version'])")
          case "$TAG" in
            "v$version")
              section="$version"
              prerelease=false
              ;;
            "v$version"-?*)
              section="Unreleased"
              prerelease=true
              ;;
            *)
              echo "::error::$TAG does not match version $version"
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "section=$section"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          SECTION: ${{ steps.tag.outputs.section }}
        run: |
          awk -v heading="## [$SECTION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No [$SECTION] section in CHANGELOG.md"
            exit 1
          fi

      - name: Build image
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "config-driven-etl:$VERSION" .
          built=$(docker run --rm "config-driven-etl:$VERSION" --version)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::Image reports version $built, expected $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
