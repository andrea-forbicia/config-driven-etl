name: Scheduled runs

# Runs every dataset in datasets/ once a day, from main, into the
# production environment: its own BigQuery dataset and service account,
# reached through Workload Identity Federation, so no key is stored.
# The environment holds GCP_SERVICE_ACCOUNT, BQ_DATASET and the variable
# BQ_AUDIT_TABLE; GCP_PROJECT_ID and GCP_WORKLOAD_IDENTITY_PROVIDER are
# the repository secrets the gcp tests use.

on:
  schedule:
    # Off the hour: runs queued at :00 are the most delayed.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datasets:
    name: List datasets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      # example.yaml documents every option with a placeholder source.
      - name: List dataset files
        id: list
        run: |
          files=$(find datasets -maxdepth 1 -name '*.yaml' \
            ! -name example.yaml | sort | jq -Rsc 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.dataset }}
    needs: datasets
    if: needs.datasets.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      # One broken source must not stop the others from loading.
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.datasets.outputs.files) }}
    # Two runs of one dataset would race on the same tables; a dispatch
    # during a scheduled run waits for it instead.
    concurrency:
      group: schedule-${{ matrix.dataset }}
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
      BQ_AUDIT_TABLE: ${{ vars.BQ_AUDIT_TABLE }}
      LOG_FORMAT: json
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Run
        run: python -m config_driven_etl run "$DATASET"
