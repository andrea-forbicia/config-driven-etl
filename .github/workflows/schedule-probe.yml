name: Schedule probe

# Temporary: checks that GitHub fires schedule events for this
# repository at all. Remove once a run with event schedule shows up.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event=$GITHUB_EVENT_NAME at $(date -u +%FT%TZ)"
